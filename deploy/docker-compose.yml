# Huru GYM production/beta stack: upstream api + media-free web image + Caddy (automatic HTTPS).
# Run from this directory on the server:  docker compose up -d --build
name: huru-gym

services:
  # Hands the data volume to the api's unprivileged user before every start (idempotent; also
  # fixes data written by an older root-run api).
  data-perms:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 1000:1000 /data && chmod 700 /data"]
    volumes:
      - ${HURU_DATA_DIR:-./data}:/data
    network_mode: none
    restart: "no"

  api:
    build:
      context: ../api
      target: ${API_TARGET:-default}
    image: huru-gym-api:local
    restart: unless-stopped
    # Huru: not root (audit finding 14). The image's `node` user, no Linux capabilities, no
    # privilege gain. Upstream's Coach drops to its `coach` user only for the CLI runtimes
    # (Claude/Codex), which need a root server; the HTTPS providers this deployment uses spawn
    # nothing and are unaffected (api/coach/jobs.js).
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      data-perms:
        condition: service_completed_successfully
    env_file: .env
    environment:
      - PORT=3000
      - DATA_DIR=/data
      # Caddy is the only hop in front of /api and sets X-Forwarded-For to the real client.
      - TRUST_PROXY=1
    volumes:
      - ${HURU_DATA_DIR:-./data}:/data   # users, passkeys, per-user state, session secret: BACK THIS UP
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile.huru
      args:
        APP_BUILD: ${APP_BUILD:-}
        VITE_SITE_HOST: ${HURU_DOMAIN:-gym.adxfuel.com}
    image: huru-gym-web:local
    restart: unless-stopped
    depends_on: [api]
    environment:
      - NGINX_PORT=80
      - BACKEND=api
      - PORT=3000
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - HURU_DOMAIN=${HURU_DOMAIN:?set HURU_DOMAIN in .env}
      - ACME_EMAIL=${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

  # Nightly encrypted backups of the data volume to Cloudflare R2 (backup.sh, RUNBOOK section 10).
  # Idle, and says so in its log, until the R2 keys and BACKUP_PASSPHRASE are in .env.
  backup:
    image: rclone/rclone:1.72.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    command: ["daemon"]
    environment:
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_BUCKET=${R2_BUCKET:-huru-gym-backups}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - BACKUP_PASSPHRASE=${BACKUP_PASSPHRASE:-}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ${HURU_DATA_DIR:-./data}:/data:ro
      - ./backup.sh:/backup.sh:ro
    networks: [internal]

networks:
  internal: {}

volumes:
  caddy_data: {}
  caddy_config: {}
