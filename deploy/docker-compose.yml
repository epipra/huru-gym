# Huru GYM production/beta stack: upstream api + media-free web image + Caddy (automatic HTTPS).
# Run from this directory on the server:  docker compose up -d --build
name: huru-gym

services:
  api:
    build:
      context: ../api
      target: ${API_TARGET:-default}
    image: huru-gym-api:local
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
      - DATA_DIR=/data
      # Caddy is the only hop in front of /api and sets X-Forwarded-For to the real client.
      - TRUST_PROXY=1
    volumes:
      - ${HURU_DATA_DIR:-./data}:/data   # users, passkeys, per-user state, session secret: BACK THIS UP
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile.huru
      args:
        APP_BUILD: ${APP_BUILD:-}
        VITE_SITE_HOST: ${HURU_DOMAIN:-gym.adxfuel.com}
    image: huru-gym-web:local
    restart: unless-stopped
    depends_on: [api]
    environment:
      - NGINX_PORT=80
      - BACKEND=api
      - PORT=3000
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - HURU_DOMAIN=${HURU_DOMAIN:?set HURU_DOMAIN in .env}
      - ACME_EMAIL=${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

networks:
  internal: {}

volumes:
  caddy_data: {}
  caddy_config: {}
