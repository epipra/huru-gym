  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <!-- "H" whose crossbar is a barbell -->
  <rect x="150" y="136" width="56" height="240" rx="14" fill="#fff"/>
  <rect x="306" y="136" width="56" height="240" rx="14" fill="#fff"/>
  <rect x="120" y="236" width="272" height="40" rx="12" fill="#fff"/>
